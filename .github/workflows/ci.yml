name: Build and security integration tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Keycloak.Starter.sln
      - run: dotnet build Keycloak.Starter.sln -c Release --no-restore --warnaserror
      - run: dotnet test Keycloak.Starter.sln -c Release --no-build
      - name: Start a fresh development stack
        run: docker compose --profile api up -d --build --wait --wait-timeout 180
      - name: Exercise the imported demo realm
        run: python3 scripts/smoke-test.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile api logs --no-color --tail=100
      - name: Clean up the development stack
        if: always()
        run: docker compose --profile api down --volumes
