services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local-postgres-password}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-keycloak-db-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-keycloak-db-password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-local-admin-password}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep -q ' 200 '; } 0<>/dev/tcp/localhost/9000
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: src/Keycloak.Starter.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Keycloak__Authority: http://localhost:${KEYCLOAK_PORT:-8080}/realms/starter
      Keycloak__Audience: starter-api
      Keycloak__MetadataAddress: http://keycloak:8080/realms/starter/.well-known/openid-configuration
    ports:
      - "127.0.0.1:${API_PORT:-5150}:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          { printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&0; grep -q ' 200 '; } 0<>/dev/tcp/localhost/8080
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
